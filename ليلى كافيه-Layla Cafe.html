<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.css0">
    <title>ليلى كافيه | Layla Cafe</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #f5e6d3, #d8c3a5);
            color: #3d2b1f;
            line-height: 1.7;
        }

        header {
            background: url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?q=80&w=1470') center/cover no-repeat;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            position: relative;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(61, 43, 31, 0.65);
        }

        .header-content {
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 4.5rem;
            margin-bottom: 10px;
            text-shadow: 3px 3px 10px rgba(0,0,0,0.8);
        }

        .subtitle {
            font-size: 1.8rem;
            margin-bottom: 30px;
        }

        .btn {
            background: #8b6f47;
            color: white;
            padding: 14px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.4s;
        }

        .btn:hover {
            background: #a67b5b;
            transform: scale(1.05);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        section {
            padding: 80px 0;
            text-align: center;
        }

        h2 {
            font-size: 3rem;
            margin-bottom: 40px;
            color: #5d4037;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 50px;
        }

        .menu-item {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: 0.4s;
        }

        .menu-item:hover {
            transform: translateY(-15px);
        }

        .menu-item img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .menu-item h3 {
            padding: 20px 15px 10px;
            font-size: 1.5rem;
        }

        .price {
            color: #8b6f47;
            font-size: 1.4rem;
            font-weight: bold;
            padding-bottom: 20px;
        }

        footer {
            background: #3d2b1f;
            color: #f5e6d3;
            padding: 50px 0;
            text-align: center;
        }

        .social a {
            color: #f5e6d3;
            font-size: 2rem;
            margin: 0 15px;
            transition: 0.3s;
        }

        .social a:hover {
            color: #a67b5b;
        }

        @media (max-width: 768px) {
            h1 { font-size: 3rem; }
            .subtitle { font-size: 1.4rem; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="header-content">
            <h1>ليلى كافيه</h1>
            <p class="subtitle">قهوتك المفضلة في مكان دافئ وهادئ</p>
            <button class="btn">اطلب الآن</button>
        </div>
    </header>

    <section class="container">
        <h2>منيو مختار</h2>
        <div class="menu-grid">
            <div class="menu-item">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSzdLxZ6EtwEM1obVzHmE3Wo7jhD3qlLVpHP_jQxeViCQ&s=10" alt="اسبريسو">
                <h3>إسبريسو</h3>
                <p class="price">٣٠ جنيه</p>
            </div>
            <div class="menu-item">
                <img src="https://images.unsplash.com/photo-1512568400610-62da28bc8a13?q=80&w1470" alt="كابتشينو">
                <h3>كابتشينو</h3>
                <p class="price">٨٥ جنيه</p>
            </div>
            <div class="menu-item">
                <img src="https://www.forkinthekitchen.com/wp-content/uploads/2022/06/220518.vanilla.latte-6414.jpg" alt="لاتر">
                <h3>لاتيه فانيليا</h3>
                <p class="price">٨٠ جنيه</p>
            </div>
            <div class="menu-item">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTipz-pq79ZmlDUMGdHnMDYjpkMwHfGk9zH4NWAGrO2_g&s=10" alt="كرواسه">
                <h3>كريمة كراميل فرابيه</h3>
                <p class="price">٩٠ جنيه</p>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <h2>ليلى كافيه</h2>
            <p>نفتح يومياً من ٧ صباحاً حتى ١٢ منتصف الليل</p>
            <div class="social">
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-snapchat"></i></a>
                <a href="#"><i class="fab fa-tiktok"></i></a>
            </div>
            <p>&copy; 2025 ليلى كافيه - كل الحقوق محفوظة</p>
        </div>
    </footer>

</body>
</html>
